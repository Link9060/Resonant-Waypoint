name: Refresh Waypoint patched dependency lock

on:
  push:
    branches: [design/live-arrow-waypoint-cohesion]
    paths:
      - .github/workflows/refresh-waypoint-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/live-arrow-waypoint-cohesion
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Next to patched version and regenerate locked dependencies
        run: npm install next@16.4.5 --save-exact --package-lock-only --ignore-scripts
      - name: Verify security audit
        run: npm audit --audit-level=critical
      - name: Commit lockfile update to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security(waypoint): upgrade Next to patched 16.4.5'
          git push origin HEAD:design/live-arrow-waypoint-cohesion
