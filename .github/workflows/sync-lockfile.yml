name: Sync Waypoint lockfile

on:
  push:
    branches:
      - enterarrow-domain
    paths:
      - package.json
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: enterarrow-domain

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate exact dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify critical dependency audit
        run: npm audit --audit-level=critical

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock Waypoint production dependencies"
          git push origin HEAD:enterarrow-domain
