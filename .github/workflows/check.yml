name: Check Waypoint

on:
  pull_request:
    branches:
      - main
      - enterarrow-domain
      - beta-foundation-polish-20261023

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Temporary, review-only security remediation: generate the exact
      # new npm lockfile on a trusted runner, then commit it to this PR.
      - name: Prepare and print Next.js patched lockfile for review
        run: |
          npm install next@16.4.6 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "require('fs').readFileSync('package-lock.json','utf8').split('\\n').forEach((line,i)=>console.log('ARROWLOCK:'+i+':'+line))"
      - name: Install locked dependencies
        run: npm ci

      - name: Critical dependency audit
        run: npm run security-check

      - name: Production checks and TypeScript
        run: npm run typecheck

      - name: Verify static export
        run: npm run build
