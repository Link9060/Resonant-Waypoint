name: Check Waypoint

on:
  pull_request:
    branches:
      - main
      - enterarrow-domain

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Critical dependency audit
        run: npm run security-check

      - name: Production checks and TypeScript
        run: npm run typecheck

      - name: Verify static export
        run: npm run build
